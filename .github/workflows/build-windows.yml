name: Build Standalone Windows Release

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE20: 'true'

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release?'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r fsoc_engine/requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Verify Core Imports
        run: |
          python -c "import fsoc; print('fsoc OK')"
          python -c "import fastapi; print('fastapi OK')"
          python -c "import uvicorn; print('uvicorn OK')"
          python -c "import cv2; print('cv2 OK')"
          python -c "import onnxruntime; print('onnxruntime OK')"
        working-directory: fsoc_engine
        env:
          PYTHONPATH: src

      - name: Run Smoke Selftest (source, pre-freeze)
        run: |
          python launcher.py --selftest
        working-directory: fsoc_engine

      - name: Install Inno Setup 6
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate Branding Assets
        run: |
          python make_icon.py
        working-directory: fsoc_engine

      - name: Build PyInstaller Executable
        run: |
          pyinstaller NETRA.spec --noconfirm --clean
        working-directory: fsoc_engine

      - name: Verify Frozen Executable (--selftest)
        run: |
          python -c "
          import subprocess, sys
          result = subprocess.run(
              ['dist/NETRA/NETRA.exe', '--selftest'],
              capture_output=True, text=True, timeout=120
          )
          print('EXIT CODE:', result.returncode)
          print('STDOUT:', result.stdout)
          print('STDERR:', result.stderr)
          sys.exit(result.returncode)
          "
        working-directory: fsoc_engine
        continue-on-error: true

      - name: Package Portable ZIP
        run: |
          if not exist release mkdir release
          if exist release\NETRA-Portable.zip del /f /q release\NETRA-Portable.zip
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Compress-Archive -Path dist\NETRA\* -DestinationPath release\NETRA-Portable.zip -Force"
        working-directory: fsoc_engine
        shell: cmd

      - name: Compile Inno Setup Installer
        run: |
          & "ISCC.exe" /DAppVersion=1.0.0 installer.iss
        working-directory: fsoc_engine
        continue-on-error: true

      - name: Generate Checksums
        run: |
          python make_checksums.py
        working-directory: fsoc_engine

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NETRA-Windows-Release
          path: |
            fsoc_engine/release/NETRA-Setup.exe
            fsoc_engine/release/NETRA-Portable.zip
            fsoc_engine/release/checksums.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish to GitHub Releases
        if: ${{ github.event.inputs.publish_release == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "🚀 NETRA ${{ github.event.inputs.tag_name || github.ref_name }} - Stable Windows Release"
          body_path: fsoc_engine/release/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            fsoc_engine/release/NETRA-Setup.exe
            fsoc_engine/release/NETRA-Portable.zip
            fsoc_engine/release/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
